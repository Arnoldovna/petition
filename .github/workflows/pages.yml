name: Pages

# The demo page (site/index.html, Etappe 3b): the recorded demo video and the screenshots, built by
# `pnpm site:build` into dist/site. GitHub Pages is free only for public repositories, so both jobs run only while
# the repository is public (CI cost rule, ADR 0018, like release.yml); while it is private they show as skipped.
# One-time setup after going public: Settings -> Pages -> Source "GitHub Actions" (docs/OPERATIONS.md section 3).
on:
  push:
    branches: [main]
    # Only what the page is built from. Dependency bumps (package.json, lockfile) do not redeploy on their own; the
    # next page change or a manual run picks them up.
    paths:
      - site/**
      - docs/media/demo-*.mp4
      - docs/media/demo-*.webm
      - docs/media/*-light.png
      - docs/media/*-dark.png
      - src/styles/**
      - public/favicon.svg
      - scripts/build-site.mjs
      - scripts/copy-fonts.mjs
      - .nvmrc
      - .github/actions/setup/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits instead of cancelling a deployment halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build page
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm site:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site

  deploy:
    name: deploy page
    needs: build
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
